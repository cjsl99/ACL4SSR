name: Convert List to MRS

on:
  push:
    paths:
      - 'Clash/*.list'
      - 'Clash/**/*.list'
  schedule:
    # 每天 UTC 04:30（北京时间 12:30）运行，确保在拉取更新脚本完成后执行
    - cron: '30 4 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  convert-ruleset:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予写权限以推送 .mrs 文件

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 下载并配置最新版 Mihomo
        run: |
          # 自动获取并解压最新 Linux-amd64 版 Mihomo
          LATEST_URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.assets[] | select(.name | contains("linux-amd64") and (contains("compatible") | not) and (endswith(".gz"))) | .browser_download_url' | head -n 1)
          curl -sSL "$LATEST_URL" | gunzip > mihomo
          chmod +x mihomo

      - name: 自动识别并转换 .list 为 .mrs
        run: |
          python3 -c "
          import os, subprocess, re

          clash_dir = 'Clash'
          if not os.path.exists(clash_dir):
              print('Clash 目录不存在')
              exit(0)

          for root, dirs, files in os.walk(clash_dir):
              for file in files:
                  if file.endswith('.list'):
                      filepath = os.path.join(root, file)
                      # os.path.splitext 会保持原有路径，仅替换扩展名，确保输出在同目录
                      mrs_path = os.path.splitext(filepath)[0] + '.mrs'
                      
                      behavior = 'domain'
                      with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                          valid_lines = [line.strip() for line in f if line.strip() and not line.strip().startswith('#')]
                      
                      if valid_lines:
                          sample = valid_lines[0]
                          # 判断是否为 classical 规则（如含有 DOMAIN-SUFFIX, IP-CIDR 等类型前缀）
                          if any(sample.startswith(prefix) for prefix in ['DOMAIN', 'IP-CIDR', 'GEOIP', 'USER-AGENT', 'URL-REGEX', 'PROCESS-NAME', 'AND', 'OR', 'NOT']):
                              behavior = 'classical'
                          # 判断是否为 ipcidr 纯 IP / 掩码规则
                          elif re.match(r'^([0-9]{1,3}\.){3}[0-9]{1,3}(/[0-9]{1,2})?$', sample) or ':' in sample:
                              behavior = 'ipcidr'
                          # 默认为纯域名 domain 规则
                          else:
                              behavior = 'domain'

                      print(f'正在转换: {filepath} -> {mrs_path} (类型: {behavior})')
                      subprocess.run(['./mihomo', 'convert-ruleset', behavior, 'text', filepath, mrs_path])
          "

      - name: 提交并推送生成的 .mrs 文件
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: convert .list to .mrs"
          branch: main
          file_pattern: 'Clash/' # 递归提交 Clash 文件夹下的所有变动（不论单层或多层子目录）

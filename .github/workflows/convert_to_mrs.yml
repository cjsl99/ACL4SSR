name: Convert List to MRS

on:
  push:
    paths:
      - 'Clash/*.list'
      - 'Clash/**/*.list'
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  convert-ruleset:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 下载并配置最新版 Mihomo
        run: |
          LATEST_URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.assets[] | select(.name | contains("linux-amd64") and (contains("compatible") | not) and (endswith(".gz"))) | .browser_download_url' | head -n 1)
          curl -sSL "$LATEST_URL" | gunzip > mihomo
          chmod +x mihomo

      - name: 全量扫描识别并转换 .list 为 .mrs
        run: |
          python3 -c "
          import os, subprocess, re

          clash_dir = 'Clash'
          if not os.path.exists(clash_dir):
              print('Clash 目录不存在')
              exit(0)

          for root, dirs, files in os.walk(clash_dir):
              for file in files:
                  if file.endswith('.list'):
                      filepath = os.path.join(root, file)
                      mrs_path = os.path.splitext(filepath)[0] + '.mrs'
                      
                      with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                          lines = [line.strip() for line in f if line.strip() and not line.strip().startswith('#')]
                      
                      if not lines:
                          continue

                      # 检查是否包含逗号分隔的前缀（如 DOMAIN-SUFFIX, IP-CIDR, PROCESS-NAME, 等）
                      has_comma = any(',' in line for line in lines)
                      
                      if has_comma:
                          behavior = 'classical'
                      else:
                          # 检查是否全为 IP / CIDR 格式
                          is_ip = all(
                              re.match(r'^([0-9]{1,3}\.){3}[0-9]{1,3}(/[0-9]{1,2})?$', line) or ':' in line 
                              for line in lines
                          )
                          if is_ip:
                              behavior = 'ipcidr'
                          else:
                              behavior = 'domain'

                      print(f'转换中: {filepath} -> {mrs_path} (识别类型: {behavior})')
                      subprocess.run(['./mihomo', 'convert-ruleset', behavior, 'text', filepath, mrs_path])
          "

      - name: 提交并推送生成的 .mrs 文件
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: convert .list to .mrs"
          branch: main
          file_pattern: 'Clash/'

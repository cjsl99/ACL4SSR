name: Convert Private List to MRS

on:
  push:
    paths:
      - 'Clash/private.list'
  schedule:
    # 每天 UTC 04:30（北京时间 12:30）运行，刚好在拉取 private.list 的任务之后
    - cron: '30 4 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  convert-ruleset:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予写权限以推送 private.mrs 文件

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 下载并配置最新版 Mihomo
        run: |
          LATEST_URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.assets[] | select(.name | contains("linux-amd64") and (contains("compatible") | not) and (endswith(".gz"))) | .browser_download_url' | head -n 1)
          curl -sSL "$LATEST_URL" | gunzip > mihomo
          chmod +x mihomo

      - name: 转换 private.list 为 private.mrs
        run: |
          if [ -f "Clash/private.list" ]; then
            # private.list 全为纯 IP/CIDR 规则，必须指定 behavior 为 ipcidr
            ./mihomo convert-ruleset ipcidr text Clash/private.list Clash/private.mrs
            echo "转换成功: Clash/private.list -> Clash/private.mrs"
          else
            echo "错误: 未找到 Clash/private.list"
            exit 1
          fi

      - name: 提交并推送 private.mrs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: convert private.list to private.mrs"
          branch: main
          file_pattern: 'Clash/private.mrs'
